<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Veracross Grade Estimator</title>
  <style>
    :root {
      --ink: #0e2442;
      --paper: #ffffff;
      --slate: #5a6a7e;
      --rule: #dce1e8;
      --track: #e9eef4;
      --fill: #1f4e8c;
      --tick: #b7c3d2;
      --knob: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e8edf3;
        --paper: #0f1b2d;
        --slate: #93a1b3;
        --rule: #26364c;
        --track: #1c2b41;
        --fill: #8caad2;
        --tick: #3b4d66;
        --knob: #d5dde7;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 300px;
      background: var(--paper);
      color: var(--ink);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--rule);
    }
    header h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .refresh {
      border: 0;
      background: none;
      padding: 2px 0;
      color: var(--slate);
      font: inherit;
      cursor: pointer;
    }
    .refresh:hover { color: var(--ink); }

    main { padding: 20px 20px 18px; }

    .grade {
      margin: 0;
      font-size: 48px;
      line-height: 1;
      font-weight: 300;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }
    .grade-caption {
      margin: 6px 0 0;
      color: var(--slate);
    }

    /* gauge: 50–100%, where most class grades fall */
    .gauge { margin: 22px 0 4px; }
    .track {
      position: relative;
      height: 6px;
      background: var(--track);
    }
    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      background: var(--fill);
      transition: width 400ms ease-out;
    }
    .ticks {
      position: relative;
      height: 16px;
      margin-top: 4px;
      font-size: 10px;
      color: var(--slate);
      font-variant-numeric: tabular-nums;
    }
    .ticks span {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
    }
    .ticks span::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      width: 1px;
      height: 6px;
      background: var(--tick);
    }
    .ticks span:first-child { transform: none; }
    .ticks span:first-child::before { left: 0; }
    .ticks span:last-child { transform: translateX(-100%); }
    .ticks span:last-child::before { left: auto; right: 0; }

    .message h2 {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 600;
    }
    .message p { margin: 0; color: var(--slate); }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px;
      border-top: 1px solid var(--rule);
      cursor: pointer;
    }

    .switch { position: relative; width: 34px; height: 20px; flex-shrink: 0; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .switch .slot {
      position: absolute; inset: 0;
      background: var(--track);
      border: 1px solid var(--rule);
      border-radius: 10px;
      transition: background 150ms;
    }
    .switch .slot::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--knob);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      transition: transform 150ms;
    }
    .switch input:checked + .slot { background: var(--fill); border-color: var(--fill); }
    .switch input:checked + .slot::after { transform: translateX(14px); }
    .switch input:focus-visible + .slot,
    .refresh:focus-visible { outline: 2px solid var(--fill); outline-offset: 2px; }

    footer {
      padding: 12px 20px 16px;
      border-top: 1px solid var(--rule);
      color: var(--slate);
      font-size: 11px;
      line-height: 1.5;
    }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      .fill, .switch .slot, .switch .slot::after { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Grade estimate</h1>
    <button class="refresh" id="refresh" type="button">Refresh</button>
  </header>

  <main>
    <section id="result" hidden>
      <p class="grade" id="grade">—</p>
      <p class="grade-caption" id="caption"></p>
      <div class="gauge" aria-hidden="true">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="ticks">
          <span style="left:0%">50</span>
          <span style="left:20%">60</span>
          <span style="left:40%">70</span>
          <span style="left:60%">80</span>
          <span style="left:80%">90</span>
          <span style="left:100%">100</span>
        </div>
      </div>
    </section>

    <section class="message" id="message">
      <h2 id="message-title">Checking this page…</h2>
      <p id="message-body"></p>
    </section>
  </main>

  <label class="setting">
    <span>Also show on the page</span>
    <span class="switch">
      <input type="checkbox" id="showPanel" />
      <span class="slot"></span>
    </span>
  </label>

  <footer>
    Adds up the points on every scored assignment. Category weights aren't applied, so your official grade may differ.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
